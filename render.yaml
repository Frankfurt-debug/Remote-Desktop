# Render Blueprint. Must live at the repo ROOT for Render to detect it.
# Deploy via Render dashboard -> "New +" -> "Blueprint" -> pick this repo.
services:
  - type: web
    name: remote-desktop-signaling
    runtime: node
    plan: free
    # The server lives in the signaling-server subfolder; host-agent and viewer
    # are siblings (the server serves the viewer from ../viewer).
    rootDir: signaling-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
