# Render Blueprint. With this file in the repo you can deploy via
# Render dashboard -> "New +" -> "Blueprint" and point it at your GitHub repo.
services:
  - type: web
    name: remote-desktop-signaling
    runtime: node
    plan: free
    # The repo root is the remote-desktop folder, which contains the other
    # folders (host-agent, viewer) too; the server lives in signaling-server.
    rootDir: signaling-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
