<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remote Desktop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; display: block; background: #000; cursor: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: #ddd; background: rgba(0,0,0,.85); z-index: 10; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #overlay button {
    padding: 12px 22px; font-size: 16px; border: 0; border-radius: 8px;
    background: #2d7dff; color: #fff; cursor: pointer;
  }
  #overlay input { padding: 8px; border-radius: 6px; border: 1px solid #444; background:#111; color:#eee; width: 320px; }
  #status { position: fixed; top: 8px; left: 8px; color: #6f6; font-size: 12px; z-index: 5; opacity:.7; pointer-events:none; }
  .row { display:flex; gap:8px; align-items:center; }
  label { font-size: 13px; color:#aaa; }
</style>
</head>
<body>
  <div id="stage"><video id="video" autoplay playsinline></video></div>
  <div id="status"></div>

  <div id="overlay">
    <h1>Remote Desktop Viewer</h1>
    <div class="row"><label>Signaling</label><input id="server" /></div>
    <div class="row"><label>Room</label><input id="room" style="width:120px" /></div>
    <button id="connectBtn">Connect</button>
    <div id="hint" style="font-size:13px;color:#888;max-width:380px">
      After the video appears, click it to capture the mouse (Pointer Lock).
      Press <b>Esc</b> to release. Double-press <b>Esc</b> isn't needed — your
      keystrokes are forwarded to the remote PC while locked.
    </div>
  </div>

<script>
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const video = $("video");
const overlay = $("overlay");
const statusEl = $("status");

$("server").value = qs.get("server") || `ws://${location.hostname || "localhost"}:8080`;
$("room").value = qs.get("room") || "default";

const ICE = [{ urls: ["stun:stun.l.google.com:19302"] }];
// To add TURN, append e.g.:
// ICE.push({ urls: "turn:turn.example.com:3478", username: "user", credential: "pass" });

let ws, pc, inputChannel;

function setStatus(s) { statusEl.textContent = s; }

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function sendInput(obj) { if (inputChannel && inputChannel.readyState === "open") inputChannel.send(JSON.stringify(obj)); }

$("connectBtn").onclick = connect;

function connect() {
  const url = $("server").value.trim();
  const room = $("room").value.trim() || "default";
  setStatus("connecting...");
  ws = new WebSocket(url);

  ws.onopen = () => {
    send({ type: "register", role: "viewer", room });
    setStatus("waiting for host...");
  };

  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "offer") {
      await handleOffer(msg);
    } else if (msg.type === "host-ready") {
      setStatus("host ready, negotiating...");
    } else if (msg.type === "peer-left") {
      setStatus("host disconnected");
      teardown();
    }
  };

  ws.onclose = () => setStatus("signaling closed");
  ws.onerror = () => setStatus("signaling error");
}

async function handleOffer(msg) {
  setStatus("offer received");
  pc = new RTCPeerConnection({ iceServers: ICE });

  pc.ontrack = (e) => {
    video.srcObject = e.streams[0];
    overlay.classList.add("hidden");
    setStatus("streaming — click to capture mouse");
  };

  // The host creates the "input" data channel; we receive it here.
  pc.ondatachannel = (e) => {
    inputChannel = e.channel;
    inputChannel.onopen = () => setStatus("input channel open");
  };

  pc.onconnectionstatechange = () => {
    setStatus("peer: " + pc.connectionState);
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected") teardown();
  };

  await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIceComplete(pc);          // non-trickle: send full SDP with candidates
  send({ type: "answer", sdp: pc.localDescription.sdp });
}

function waitIceComplete(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

function teardown() {
  if (pc) { try { pc.close(); } catch {} pc = null; }
  inputChannel = null;
  video.srcObject = null;
  overlay.classList.remove("hidden");
}

// ---------------------------------------------------------------------------
// Input capture
// ---------------------------------------------------------------------------
const locked = () => document.pointerLockElement === video;

video.addEventListener("click", () => {
  if (!locked()) video.requestPointerLock();
});

document.addEventListener("mousemove", (e) => {
  if (!inputChannel) return;
  if (locked()) {
    // Relative deltas for gaming.
    sendInput({ type: "mousemoverel", dx: e.movementX, dy: e.movementY });
  } else {
    // Absolute, normalised to the video's displayed rectangle.
    const r = video.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) sendInput({ type: "mousemove", x, y });
  }
});

document.addEventListener("mousedown", (e) => {
  if (!inputChannel || video.srcObject === null) return;
  sendInput({ type: "mousedown", button: e.button });
});
document.addEventListener("mouseup", (e) => {
  if (!inputChannel || video.srcObject === null) return;
  sendInput({ type: "mouseup", button: e.button });
});

document.addEventListener("wheel", (e) => {
  if (!inputChannel) return;
  if (video.srcObject) e.preventDefault();
  sendInput({ type: "wheel", dy: e.deltaY });
}, { passive: false });

// Block the context menu so right-click reaches the remote.
document.addEventListener("contextmenu", (e) => { if (video.srcObject) e.preventDefault(); });

document.addEventListener("keydown", (e) => {
  if (!inputChannel || !video.srcObject) return;
  // Let the user escape pointer lock with Esc instead of forwarding it.
  if (e.key === "Escape" && locked()) return;
  e.preventDefault();
  sendInput({ type: "keydown", code: e.code, key: e.key });
});
document.addEventListener("keyup", (e) => {
  if (!inputChannel || !video.srcObject) return;
  if (e.key === "Escape" && !locked()) { /* still forward when not locked */ }
  e.preventDefault();
  sendInput({ type: "keyup", code: e.code, key: e.key });
});

// Auto-connect if a server was provided in the URL.
if (qs.get("autoconnect") === "1") connect();
</script>
</body>
</html>
