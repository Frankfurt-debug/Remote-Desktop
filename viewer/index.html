<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remote Desktop</title>
<style>
  :root { --accent:#2d7dff; --bg:#0c0c0e; --panel:#16161a; --line:#2a2a32; --txt:#e8e8ea; --dim:#9a9aa4; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui, sans-serif; color:var(--txt); }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  video { max-width:100%; max-height:100%; display:block; background:#000; }
  video.fill { width:100%; height:100%; object-fit:fill; }
  video.contain { width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; }

  /* While streaming, hide the local cursor so only the host-drawn one shows
     (fixes seeing two cursors / the mouse over a fullscreen game). Buttons
     re-enable a pointer so the toolbar stays usable. */
  body.nocursor, body.nocursor video, body.nocursor #stage { cursor:none; }
  body.nocursor .ui { cursor:pointer; }

  /* Toolbar (top-left) */
  #toolbar { position:fixed; top:10px; left:10px; z-index:6; display:none; gap:6px; }
  body.streaming #toolbar { display:flex; }
  body.hidetoolbar #toolbar { display:none; }
  .ui { background:rgba(20,20,26,.72); color:var(--txt); border:1px solid var(--line);
        border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; backdrop-filter:blur(4px); }
  .ui:hover { background:rgba(40,40,52,.9); }

  /* Stats HUD (top-right) */
  #hud { position:fixed; top:10px; right:10px; z-index:6; display:none;
         background:rgba(10,10,14,.66); border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; color:#bfe;
         backdrop-filter:blur(4px); pointer-events:none; min-width:128px; }
  #hud b { color:#fff; }
  #hud .lock { color:#ffd479; }

  /* Settings / connect overlay */
  #overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
             background:rgba(0,0,0,.82); backdrop-filter:blur(3px); overflow:auto; }
  #overlay.hidden { display:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px;
           width:380px; max-width:92vw; box-shadow:0 16px 50px rgba(0,0,0,.5); }
  .panel h1 { font-size:19px; margin:0 0 4px; }
  .panel .sub { color:var(--dim); font-size:13px; margin:0 0 16px; }
  .grp { border-top:1px solid var(--line); padding:13px 0 4px; }
  .grp h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:9px 0; }
  .field label { font-size:13px; color:#d6d6da; }
  .field .val { font-size:12px; color:var(--dim); min-width:42px; text-align:right; }
  input[type=text] { width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px;
                     border:1px solid var(--line); background:#0e0e12; color:var(--txt); font-size:13px; }
  input[type=range] { width:150px; accent-color:var(--accent); }
  select { background:#0e0e12; color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px; }
  input[type=checkbox] { width:17px; height:17px; accent-color:var(--accent); }
  .full { display:block; margin:4px 0 2px; }
  .btn { width:100%; margin-top:18px; padding:12px; border:0; border-radius:9px; background:var(--accent);
         color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.sec { background:#2a2a32; margin-top:8px; }
  #status { position:fixed; bottom:8px; left:10px; color:#6f6; font-size:12px; z-index:5; opacity:.7; pointer-events:none; }
  /* z-index above the overlay (10) so the log stays readable — and un-blurred —
     even while the settings menu is open. */
  #debug { position:fixed; bottom:30px; left:10px; z-index:12; width:340px; max-height:42vh; overflow:auto;
           background:rgba(8,8,12,.94); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
           font:11px/1.45 ui-monospace, Menlo, Consolas, monospace; color:#cdd; display:none; }
  #debug.show { display:block; }
  #debug .ok { color:#6f6; } #debug .bad { color:#ff6b6b; } #debug .warn { color:#ffd479; } #debug .dim { color:#888; }
  .hint { font-size:12px; color:var(--dim); margin-top:14px; line-height:1.5; }
</style>
</head>
<body>
  <div id="stage"><video id="video" autoplay playsinline></video></div>

  <div id="toolbar">
    <button class="ui" id="btnSettings">⚙ Settings</button>
    <button class="ui" id="btnFull">⛶ Fullscreen</button>
    <button class="ui" id="btnLock">🖱 Capture mouse</button>
    <button class="ui" id="btnLog">📋 Log</button>
  </div>

  <div id="hud"></div>
  <div id="debug"></div>
  <div id="status"></div>

  <div id="overlay">
    <div class="panel">
      <h1>Remote Desktop</h1>
      <p class="sub" id="panelSub">Configure, then connect.</p>

      <div class="grp" style="border-top:0; padding-top:0">
        <h2>Connection</h2>
        <label class="full" style="font-size:13px;color:#d6d6da">Signaling server</label>
        <input type="text" id="server" />
        <label class="full" style="font-size:13px;color:#d6d6da;margin-top:8px">Room</label>
        <input type="text" id="room" />
        <div class="field" style="margin-top:10px"><label for="relayOn">Force relay (school / blocked networks)</label><input type="checkbox" id="relayOn"></div>
      </div>

      <div class="grp">
        <h2>Video</h2>
        <div class="field"><label for="fps">Frame rate</label>
          <input type="range" id="fps" min="10" max="60" step="5"><span class="val" id="fpsV"></span></div>
        <div class="field"><label for="scale">Quality (resolution)</label>
          <select id="scale">
            <option value="1">100% (sharpest)</option>
            <option value="0.75">75%</option>
            <option value="0.5">50% (smoother)</option>
            <option value="0.25">25% (lowest)</option>
          </select></div>
        <div class="field"><label for="fit">Fit to window</label>
          <select id="fit">
            <option value="contain">Keep aspect (letterbox)</option>
            <option value="fill">Stretch to fill</option>
          </select></div>
      </div>

      <div class="grp">
        <h2>Mouse</h2>
        <div class="field"><label for="lock">Capture mouse on click (gaming)</label><input type="checkbox" id="lock"></div>
        <div class="field"><label for="sens">Sensitivity</label>
          <input type="range" id="sens" min="0.2" max="3" step="0.1"><span class="val" id="sensV"></span></div>
        <div class="field"><label for="smooth">Smooth movement</label><input type="checkbox" id="smooth"></div>
        <div class="field"><label for="cursor">Show cursor on screen</label><input type="checkbox" id="cursor"></div>
      </div>

      <div class="grp">
        <h2>Overlay</h2>
        <div class="field"><label for="hudOn">Show stats (top-right)</label><input type="checkbox" id="hudOn"></div>
        <div class="field"><label for="toolbarOn">Show toolbar buttons (top-left)</label><input type="checkbox" id="toolbarOn"></div>
        <div class="field"><label for="logOn">Show connection log (bottom-left)</label><input type="checkbox" id="logOn"></div>
        <div style="font-size:11px;color:var(--dim);margin-top:4px">Tip: with the toolbar hidden, press <b>Esc</b> to reopen this menu.</div>
      </div>

      <button class="btn" id="connectBtn">Connect</button>
      <button class="btn sec" id="testBtn">🔍 Test what's blocked</button>
      <button class="btn sec" id="doneBtn" style="display:none">Resume</button>
      <div class="hint" id="hint">After connecting, click the screen (or “Capture mouse”) to play games with Pointer Lock. Press <b>Esc</b> to release and reopen this panel.</div>
    </div>
  </div>

<script>
const BAKED_URL = "wss://remote-desktop-signaling.onrender.com";   // <-- your Render server
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), hud = $("hud"), statusEl = $("status"), debugEl = $("debug");

// ---- Diagnostics log ------------------------------------------------------
// Shows each connection step so we can see exactly where it gets stuck:
// WebSocket -> register -> offer -> answer -> ICE -> first video frame.
function dbg(msg, cls = "") {
  const t = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `${t}  ${msg}`;
  debugEl.appendChild(line);
  debugEl.scrollTop = debugEl.scrollHeight;
  console.log("[rd]", msg);
}

// ---- Settings (persisted) -------------------------------------------------
const sameOrigin = location.host
  ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host
  : BAKED_URL;
const DEFAULTS = {
  server: sameOrigin || BAKED_URL, room: "default",
  fps: 30, scale: 1, fit: "contain",
  lock: true, sens: 1, smooth: true, cursor: true, hud: true, toolbar: true, log: true, relay: false,
};
let S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("rd-settings") || "{}"));
// URL overrides
if (qs.get("server")) S.server = qs.get("server");
if (qs.get("room")) S.room = qs.get("room");
if (qs.get("sens")) S.sens = parseFloat(qs.get("sens"));
function saveSettings() { localStorage.setItem("rd-settings", JSON.stringify(S)); }

// Bind form <-> S
function formToS() {
  S.server = $("server").value.trim() || BAKED_URL;
  S.room = $("room").value.trim() || "default";
  S.fps = +$("fps").value; S.scale = +$("scale").value; S.fit = $("fit").value;
  S.lock = $("lock").checked; S.sens = +$("sens").value; S.smooth = $("smooth").checked;
  S.cursor = $("cursor").checked; S.hud = $("hudOn").checked; S.toolbar = $("toolbarOn").checked; S.log = $("logOn").checked;
  S.relay = $("relayOn").checked;
}
function sToForm() {
  $("server").value = S.server; $("room").value = S.room;
  $("fps").value = S.fps; $("fpsV").textContent = S.fps + " fps";
  $("scale").value = String(S.scale); $("fit").value = S.fit;
  $("lock").checked = S.lock; $("sens").value = S.sens; $("sensV").textContent = S.sens.toFixed(1) + "×";
  $("smooth").checked = S.smooth; $("cursor").checked = S.cursor; $("hudOn").checked = S.hud; $("toolbarOn").checked = S.toolbar; $("logOn").checked = S.log;
  $("relayOn").checked = S.relay;
}
$("fps").addEventListener("input", () => $("fpsV").textContent = $("fps").value + " fps");
$("sens").addEventListener("input", () => $("sensV").textContent = (+$("sens").value).toFixed(1) + "×");
sToForm();

// ---- Connection state -----------------------------------------------------
let ws, pc, inputChannel, connected = false, settingsOpen = true;

function setStatus(s) { statusEl.textContent = s; }
function wsSend(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function sendInput(o) { if (inputChannel && inputChannel.readyState === "open" && !settingsOpen) inputChannel.send(JSON.stringify(o)); }
function sendConfig() {
  if (inputChannel && inputChannel.readyState === "open")
    inputChannel.send(JSON.stringify({ type: "config", fps: S.fps, scale: S.scale, cursor: S.cursor }));
}

function applyVideoStyle() {
  video.className = S.fit;          // 'contain' or 'fill'
}
function updateCursorHide() {
  document.body.classList.toggle("nocursor", connected && !settingsOpen);
}

// ---- Settings panel open/close --------------------------------------------
function openSettings() {
  settingsOpen = true;
  if (document.pointerLockElement) document.exitPointerLock();
  $("connectBtn").style.display = connected ? "none" : "block";
  $("testBtn").style.display = connected ? "none" : "block";
  $("doneBtn").style.display = connected ? "block" : "none";
  $("panelSub").textContent = connected ? "Adjust settings live." : "Configure, then connect.";
  sToForm();
  overlay.classList.remove("hidden");
  updateCursorHide();
}
function closeSettings() {
  formToS(); saveSettings();
  applyVideoStyle();
  sendConfig();
  hud.style.display = S.hud ? "block" : "none";
  document.body.classList.toggle("hidetoolbar", !S.toolbar);
  debugEl.classList.toggle("show", S.log);
  overlay.classList.add("hidden");
  settingsOpen = false;
  updateCursorHide();
}

$("btnSettings").onclick = openSettings;
$("doneBtn").onclick = closeSettings;
$("connectBtn").onclick = () => { formToS(); saveSettings(); connect(); };
$("testBtn").onclick = () => { formToS(); saveSettings(); networkTest(); };
$("btnFull").onclick = toggleFullscreen;
$("btnLock").onclick = () => { if (!locked()) video.requestPointerLock(); };
$("btnLog").onclick = () => { S.log = !debugEl.classList.contains("show"); debugEl.classList.toggle("show", S.log); saveSettings(); };

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

// ---- WebRTC / signaling ---------------------------------------------------
const ICE = [
  { urls: ["stun:stun.l.google.com:19302"] },
  // For a restrictive network (school Wi-Fi), add a REAL TURN server here — e.g.
  // Cloudflare or your own coturn. Do not add a dead public relay; an
  // unreachable TURN server breaks connections that would otherwise work.
  // ICE.push({ urls: "turn:turn.example.com:443?transport=tcp", username: "...", credential: "..." });
];

let gotFirstFrame = false, candCounts = { host: 0, srflx: 0, relay: 0 };

// Standalone "what's blocked" probe: checks each network layer independently
// and prints a plain-English verdict, without needing the host to be running.
async function networkTest() {
  debugEl.innerHTML = ""; debugEl.classList.add("show");
  dbg("=== NETWORK TEST ===");

  // 1. Signaling reachability (TLS/WebSocket on 443).
  const wsOk = await new Promise((res) => {
    let done = false;
    const t = new WebSocket(S.server);
    const finish = (ok) => { if (!done) { done = true; try { t.close(); } catch {} res(ok); } };
    t.onopen = () => finish(true);
    t.onerror = () => finish(false);
    setTimeout(() => finish(false), 8000);
  });
  dbg(wsOk ? "1. Signaling (WebSocket/443): reachable ✓" : "1. Signaling (WebSocket/443): BLOCKED ✗",
      wsOk ? "ok" : "bad");

  // 2. STUN over UDP — do we get a server-reflexive candidate? That proves
  //    UDP can reach the internet (the path WebRTC media normally uses).
  const { srflx, host } = await new Promise((res) => {
    const t = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    let s = false, h = false;
    t.onicecandidate = (e) => {
      if (!e.candidate) { try { t.close(); } catch {} return res({ srflx: s, host: h }); }
      const typ = (e.candidate.candidate.match(/ typ (\w+)/) || [])[1];
      if (typ === "srflx") s = true; if (typ === "host") h = true;
    };
    t.createDataChannel("probe");
    t.createOffer().then((o) => t.setLocalDescription(o));
    setTimeout(() => { try { t.close(); } catch {} res({ srflx: s, host: h }); }, 8000);
  });
  dbg("2. Local network candidates: " + (host ? "found ✓" : "none ✗"), host ? "ok" : "warn");
  dbg(srflx ? "3. STUN/UDP to internet: works ✓ (media path is open at UDP level)"
            : "3. STUN/UDP to internet: BLOCKED ✗ (UDP filtered)", srflx ? "ok" : "bad");

  // Verdict
  dbg("— VERDICT —");
  if (!wsOk) {
    dbg("Signaling itself is blocked — the server URL is filtered on this network.", "bad");
  } else if (!srflx) {
    dbg("Signaling works but UDP is blocked. You need a TURN relay over TCP/443.", "bad");
  } else {
    dbg("Signaling ✓ and UDP ✓. If the real connection still fails AFTER 'ICE connected',", "warn");
    dbg("then the encrypted media (DTLS) is being selectively filtered (DPI). Only a", "warn");
    dbg("TURNS relay on 443 can disguise it as HTTPS — or the device is too locked down.", "warn");
  }
  dbg("Now click Connect to test the real handshake.");
}

function connect() {
  debugEl.innerHTML = ""; debugEl.classList.toggle("show", S.log);
  gotFirstFrame = false; candCounts = { host: 0, srflx: 0, relay: 0 };
  connectedAt = 0; noFrameWarned = false;
  setStatus("connecting…");
  dbg("Opening WebSocket: " + S.server);
  ws = new WebSocket(S.server);
  ws.onopen = () => {
    dbg("WebSocket OPEN ✓ — signaling reachable", "ok");
    wsSend({ type: "register", role: "viewer", room: S.room });
    dbg("Registered as viewer (room: " + S.room + ")");
    setStatus("waiting for host… (free server can take ~50s to wake)");
  };
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "offer") { dbg("Offer received from host ✓", "ok"); await handleOffer(m); }
    else if (m.type === "host-ready") { dbg("Host is ready"); setStatus("host ready, negotiating…"); }
    else if (m.type === "peer-left") { dbg("Host left", "warn"); setStatus("host disconnected"); teardown(); }
  };
  ws.onclose = () => { dbg("WebSocket CLOSED", "warn"); setStatus("signaling closed"); };
  ws.onerror = () => { dbg("WebSocket ERROR ✗ — blocked, offline, or wrong URL", "bad"); setStatus("signaling error — is the server URL right / blocked?"); };
}

async function handleOffer(m) {
  setStatus("negotiating…");
  const policy = S.relay ? "relay" : "all";
  if (S.relay) dbg("Force-relay ON — media will go only through TURN(S).", "warn");
  pc = new RTCPeerConnection({ iceServers: ICE, iceTransportPolicy: policy });

  pc.ontrack = (e) => {
    dbg("Video track received ✓ (waiting for frames…)", "ok");
    video.srcObject = e.streams[0];
    connected = true;
    document.body.classList.add("streaming");
    applyVideoStyle();
    closeSettings();
    setStatus("");
  };
  pc.ondatachannel = (e) => {
    inputChannel = e.channel;
    inputChannel.onopen = () => { dbg("Input channel open ✓", "ok"); sendConfig(); };
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && e.candidate.candidate) {
      const t = (e.candidate.candidate.match(/ typ (\w+)/) || [])[1];
      if (t && candCounts[t] != null) candCounts[t]++;
    }
  };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    dbg("ICE: " + s, s === "connected" || s === "completed" ? "ok" : (s === "failed" ? "bad" : "dim"));
    if (s === "failed")
      dbg("→ No network path found. This network likely needs a TURN relay.", "bad");
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    dbg("Peer: " + st, st === "connected" ? "ok" : (st === "failed" ? "bad" : "dim"));
    if (st === "disconnected") setStatus("⚠ connection unstable, recovering…");
    else if (st === "connected") setStatus("");
    else if (st === "failed" || st === "closed") { setStatus("connection lost"); teardown(); }
  };

  await pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIceComplete(pc);
  dbg(`ICE gathered — host:${candCounts.host} stun:${candCounts.srflx} relay:${candCounts.relay}`);
  if (candCounts.relay === 0) dbg("No relay candidates (no working TURN) — fine on same network, needed for school.", "dim");
  wsSend({ type: "answer", sdp: pc.localDescription.sdp });
  dbg("Answer sent → connecting media…");
}

function waitIceComplete(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((res) => {
    const f = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", f); res(); } };
    pc.addEventListener("icegatheringstatechange", f);
  });
}

function teardown() {
  if (pc) { try { pc.close(); } catch {} pc = null; }
  inputChannel = null; connected = false;
  video.srcObject = null;
  document.body.classList.remove("streaming");
  hud.style.display = "none";
  openSettings();
}

// ---- Input capture --------------------------------------------------------
const locked = () => document.pointerLockElement === video;

video.addEventListener("click", () => { if (S.lock && !locked() && !settingsOpen) video.requestPointerLock(); });

let accDx = 0, accDy = 0, pendingAbs = null;
document.addEventListener("mousemove", (e) => {
  if (!inputChannel || settingsOpen) return;
  if (locked()) {
    if (S.smooth) { accDx += e.movementX; accDy += e.movementY; }
    else sendInput({ type: "mousemoverel", dx: Math.round(e.movementX * S.sens), dy: Math.round(e.movementY * S.sens) });
  } else {
    const r = video.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
      if (S.smooth) pendingAbs = { x, y };
      else sendInput({ type: "mousemove", x, y });
    }
  }
});
function flushMouse() {
  if (inputChannel && inputChannel.readyState === "open" && !settingsOpen) {
    if (locked()) {
      if (accDx || accDy) { sendInput({ type: "mousemoverel", dx: Math.round(accDx * S.sens), dy: Math.round(accDy * S.sens) }); accDx = accDy = 0; }
    } else if (pendingAbs) { sendInput({ type: "mousemove", x: pendingAbs.x, y: pendingAbs.y }); pendingAbs = null; }
  }
  requestAnimationFrame(flushMouse);
}
requestAnimationFrame(flushMouse);

document.addEventListener("mousedown", (e) => { if (connected && !settingsOpen) sendInput({ type: "mousedown", button: e.button }); });
document.addEventListener("mouseup",   (e) => { if (connected && !settingsOpen) sendInput({ type: "mouseup", button: e.button }); });
document.addEventListener("wheel", (e) => {
  if (!connected || settingsOpen) return;
  e.preventDefault();
  // Normalise to pixels: some mice/trackpads report lines (mode 1) or pages (2).
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 33;
  else if (e.deltaMode === 2) dy *= 400;
  sendInput({ type: "wheel", dy });
}, { passive: false });
document.addEventListener("contextmenu", (e) => { if (connected) e.preventDefault(); });

document.addEventListener("keydown", (e) => {
  if (!connected) return;
  if (e.key === "Escape") {            // Esc: release lock, then open settings
    if (locked()) return;              // (browser exits lock first; next press opens panel)
    if (!settingsOpen) { openSettings(); e.preventDefault(); return; }
  }
  if (settingsOpen) return;
  e.preventDefault();
  sendInput({ type: "keydown", code: e.code, key: e.key });
});
document.addEventListener("keyup", (e) => {
  if (!connected || settingsOpen) return;
  e.preventDefault();
  sendInput({ type: "keyup", code: e.code, key: e.key });
});

// ---- Stats HUD + media diagnostics ----------------------------------------
let lastBytes = 0, lastTs = 0, connectedAt = 0, noFrameWarned = false;
async function pollStats() {
  if (!pc || !connected) return;
  if (!connectedAt) connectedAt = Date.now();
  try {
    const stats = await pc.getStats();
    let fps = "–", w = 0, h = 0, rtt = null, bytes = 0, ts = 0, frames = 0;
    stats.forEach((r) => {
      if (r.type === "inbound-rtp" && r.kind === "video") {
        if (r.framesPerSecond != null) fps = Math.round(r.framesPerSecond);
        w = r.frameWidth || w; h = r.frameHeight || h;
        bytes = r.bytesReceived || 0; ts = r.timestamp || 0; frames = r.framesDecoded || 0;
      }
      if (r.type === "candidate-pair" && r.nominated && r.currentRoundTripTime != null) rtt = r.currentRoundTripTime;
    });

    // The key diagnostic: are video frames actually arriving?
    if (bytes > 0 && !gotFirstFrame) {
      gotFirstFrame = true;
      dbg("First video data arriving ✓ — IT WORKS", "ok");
      setTimeout(() => debugEl.classList.remove("show"), 4000);
    }
    if (!gotFirstFrame && Date.now() - connectedAt > 8000 && !noFrameWarned) {
      noFrameWarned = true;
      const ice = pc.iceConnectionState, peer = pc.connectionState;
      dbg(`No video after 8s. ICE=${ice}, Peer=${peer}`, "bad");
      if (ice === "connected" || ice === "completed") {
        // ICE connected but DTLS never finished = the encrypted media is being
        // selectively dropped. Signaling + STUN pass; the media handshake doesn't.
        dbg("— VERDICT —", "bad");
        dbg("Network path is OPEN (ICE connected) but the encrypted video handshake", "bad");
        dbg("(DTLS) is being BLOCKED. Signaling ✓, STUN ✓, media ✗.", "bad");
        dbg("This is deep-packet-inspection filtering on this device/network", "bad");
        dbg("(e.g. school management software). Only a TURNS relay on 443 might bypass it.", "bad");
      } else {
        dbg("→ No network path (ICE " + ice + "). This network needs a TURN relay.", "bad");
      }
    }

    let kbps = 0;
    if (lastTs && ts > lastTs) kbps = Math.round((bytes - lastBytes) * 8 / (ts - lastTs));
    lastBytes = bytes; lastTs = ts;
    const ping = rtt != null ? Math.round(rtt * 1000) + " ms" : "–";
    if (S.hud) {
      hud.innerHTML =
        `FPS <b>${fps}</b><br>Ping <b>${ping}</b><br>` +
        `Res <b>${w}×${h}</b><br>Rate <b>${(kbps/1000).toFixed(1)} Mbps</b><br>Frames <b>${frames}</b>` +
        (locked() ? `<br><span class="lock">● mouse captured</span>` : "");
    }
  } catch {}
}
setInterval(pollStats, 1000);

// ---- Boot -----------------------------------------------------------------
openSettings();
if (qs.get("autoconnect") === "1") { formToS(); saveSettings(); connect(); }
</script>
</body>
</html>
